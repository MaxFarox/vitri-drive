<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Vitri · Google Drive</title>
  <style>
    :root { --bg: #1c1f1e; --card: #252827; --line: #3a3e3c; --text: #edeeea; --muted: #9ca19e; --accent: #f2a93b; --on-accent: #2a1a00; --danger: #ff6b6b; --ok: #4fd18b; }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
      font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); }
    .card { background: var(--card); border-radius: 16px; padding: 24px; max-width: 440px; width: 100%; text-align: center;
      box-shadow: 0 4px 24px rgba(0, 0, 0, .3); }
    .logo { width: 56px; height: 56px; border-radius: 14px; }
    h1 { font-size: 20px; margin: 12px 0 6px; }
    p { color: var(--muted); margin: 0 0 18px; }
    button { font: inherit; font-weight: 600; border: 1px solid var(--line); border-radius: 12px; padding: 12px 18px; cursor: pointer;
      background: transparent; color: var(--text); display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 48px; }
    button.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
    button:disabled { opacity: .5; cursor: default; }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    button svg { width: 20px; height: 20px; fill: currentColor; }
    .stack { display: flex; flex-direction: column; gap: 10px; }
    .basket { list-style: none; margin: 0 0 16px; padding: 0; text-align: left; max-height: 40vh; overflow: auto;
      border: 1px solid var(--line); border-radius: 12px; }
    .basket li { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-top: 1px solid var(--line); }
    .basket li:first-child { border-top: 0; }
    .basket .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .basket .kind { color: var(--muted); font-size: 12px; }
    .basket .rm { min-height: 44px; min-width: 44px; padding: 4px 10px; border: 0; color: var(--muted); }
    .error { color: var(--danger); margin-top: 16px; font-size: 14px; }
    .done { color: var(--ok); font-weight: 600; font-size: 17px; }
  </style>
</head>
<body>
<div class="card">
  <svg class="logo" viewBox="0 0 1254 1254" aria-hidden="true"><rect width="1254" height="1254" rx="220" fill="#303331"/><g fill="#fff"><path d="M183 233H395C425 233 450 252 463 278L606 565 465 815 170 255C165 245 172 233 183 233Z"/><path d="M858 233H1071C1082 233 1089 245 1084 255L778 818 643 565 790 278C803 252 828 233 858 233Z"/><path d="M624 597 762 852 680 1000C665 1027 645 1048 620 1048 595 1048 575 1027 565 1003L482 850Z"/></g></svg>
  <h1 id="title">Importar desde Google Drive</h1>
  <p id="msg">Elige las fotos y vídeos que quieras llevar a la pantalla.</p>

  <!-- Paso 1: abrir Drive -->
  <div id="start" class="stack">
    <button id="pickBtn" class="primary" disabled>
      <svg viewBox="200 130 810 720" aria-hidden="true"><path d="M446 203 570 415 335 830 215 617Z"/><path d="M480 148H720L970 579H730Z"/><path d="M520 616H990L865 831H397Z"/></svg>
      Abrir Google Drive
    </button>
    <button id="cancelBtn">Cancelar</button>
  </div>

  <!-- Paso 2: cesta con lo elegido (se puede volver a Drive a por más) -->
  <div id="review" hidden>
    <ul id="basket" class="basket"></ul>
    <div class="stack">
      <button id="sendBtn" class="primary"></button>
      <button id="moreBtn">
        <svg viewBox="200 130 810 720" aria-hidden="true"><path d="M446 203 570 415 335 830 215 617Z"/><path d="M480 148H720L970 579H730Z"/><path d="M520 616H990L865 831H397Z"/></svg>
        Añadir más de Drive
      </button>
      <button id="cancelBtn2">Cancelar</button>
    </div>
  </div>

  <!-- Paso 3: enviado (si la ventana no se cierra sola) -->
  <div id="sent" hidden>
    <p class="done" id="sentMsg"></p>
    <p>Ya puedes cerrar esta ventana: la pantalla se está descargando los archivos.</p>
    <button id="backBtn" class="primary">Volver a Vitri</button>
  </div>

  <div id="error" class="error" hidden></div>
</div>

<!-- Credenciales de tu proyecto de Google (ver README.md). Así, al actualizar esta página, no hay que volver a pegarlas. -->
<script src="config.js"></script>
<script>
'use strict';

const CONFIG = window.VITRI_DRIVE_CONFIG || {};

// Solo archivos que Vitri puede usar (las HEIC de iPhone se convierten a JPG en la pantalla).
const MIME_TYPES = 'image/jpeg,image/png,image/heic,image/heif,video/mp4,video/quicktime';
const SCOPE = 'https://www.googleapis.com/auth/drive.file';

const $ = id => document.getElementById(id);
const params = new URLSearchParams(location.search);
const target = params.get('origin') || '';
const targetPath = params.get('path') || '';
// En el móvil el panel abre esta página en la misma pestaña: al terminar se vuelve redirigiendo.
const redirectMode = params.get('mode') === 'redirect';

/* Idioma: el del panel de Vitri (?lang=es|ca|en). El castellano es la base. */
const LANG = ['es', 'ca', 'en'].includes(params.get('lang')) ? params.get('lang') : 'es';
const STRINGS = {
  ca: {
    'Importar desde Google Drive': 'Importa des de Google Drive',
    'Elige las fotos y vídeos que quieras llevar a la pantalla.': 'Tria les fotos i els vídeos que vulguis portar a la pantalla.',
    'Abrir Google Drive': 'Obre Google Drive',
    'Cancelar': 'Cancel·la',
    'Añadir más de Drive': 'Afegeix-ne més de Drive',
    'Ya puedes cerrar esta ventana: la pantalla se está descargando los archivos.': 'Ja pots tancar aquesta finestra: la pantalla està descarregant els fitxers.',
    'Volver a Vitri': 'Torna a Vitri',
    'Cancelado': 'Cancel·lat',
    'Enviado a Vitri': 'Enviat a Vitri',
    'No se ha importado nada.': 'No s\'ha importat res.',
    '✓ {n} archivo enviado': '✓ {n} fitxer enviat',
    '✓ {n} archivos enviados': '✓ {n} fitxers enviats',
    'Vídeo': 'Vídeo',
    'Foto': 'Foto',
    'Quitar {name}': 'Treu {name}',
    'Enviar {n} archivo a Vitri': 'Envia {n} fitxer a Vitri',
    'Enviar {n} archivos a Vitri': 'Envia {n} fitxers a Vitri',
    'Enviar a Vitri': 'Envia a Vitri',
    'Listo para enviar': 'Tot a punt per enviar',
    'Puedes volver a Drive para añadir más antes de enviar.': 'Pots tornar a Drive per afegir-ne més abans d\'enviar.',
    'Elige fotos y vídeos para Vitri': 'Tria fotos i vídeos per a Vitri',
    'No se ha podido iniciar sesión en Google ({err}).': 'No s\'ha pogut iniciar la sessió a Google ({err}).',
    'No se ha podido abrir el inicio de sesión de Google. Permite las ventanas emergentes para esta página.': 'No s\'ha pogut obrir l\'inici de sessió de Google. Permet les finestres emergents per a aquesta pàgina.',
    'Abre esta página desde el botón «Drive» del panel de Vitri.': 'Obre aquesta pàgina des del botó «Drive» del panell de Vitri.',
    'Falta configurar esta página: crea config.js con CLIENT_ID, API_KEY y APP_ID (ver README.md).': 'Falta configurar aquesta pàgina: crea config.js amb CLIENT_ID, API_KEY i APP_ID (vegeu README.md).',
    'No se han podido cargar los servicios de Google. Comprueba la conexión.': 'No s\'han pogut carregar els serveis de Google. Comprova la connexió.',
  },
  en: {
    'Importar desde Google Drive': 'Import from Google Drive',
    'Elige las fotos y vídeos que quieras llevar a la pantalla.': 'Choose the photos and videos you want on the screen.',
    'Abrir Google Drive': 'Open Google Drive',
    'Cancelar': 'Cancel',
    'Añadir más de Drive': 'Add more from Drive',
    'Ya puedes cerrar esta ventana: la pantalla se está descargando los archivos.': 'You can close this window now: the screen is downloading the files.',
    'Volver a Vitri': 'Back to Vitri',
    'Cancelado': 'Cancelled',
    'Enviado a Vitri': 'Sent to Vitri',
    'No se ha importado nada.': 'Nothing was imported.',
    '✓ {n} archivo enviado': '✓ {n} file sent',
    '✓ {n} archivos enviados': '✓ {n} files sent',
    'Vídeo': 'Video',
    'Foto': 'Photo',
    'Quitar {name}': 'Remove {name}',
    'Enviar {n} archivo a Vitri': 'Send {n} file to Vitri',
    'Enviar {n} archivos a Vitri': 'Send {n} files to Vitri',
    'Enviar a Vitri': 'Send to Vitri',
    'Listo para enviar': 'Ready to send',
    'Puedes volver a Drive para añadir más antes de enviar.': 'You can go back to Drive to add more before sending.',
    'Elige fotos y vídeos para Vitri': 'Choose photos and videos for Vitri',
    'No se ha podido iniciar sesión en Google ({err}).': 'Couldn\'t sign in to Google ({err}).',
    'No se ha podido abrir el inicio de sesión de Google. Permite las ventanas emergentes para esta página.': 'Couldn\'t open Google sign-in. Allow pop-ups for this page.',
    'Abre esta página desde el botón «Drive» del panel de Vitri.': 'Open this page from the “Drive” button in the Vitri panel.',
    'Falta configurar esta página: crea config.js con CLIENT_ID, API_KEY y APP_ID (ver README.md).': 'This page isn\'t set up: create config.js with CLIENT_ID, API_KEY and APP_ID (see README.md).',
    'No se han podido cargar los servicios de Google. Comprueba la conexión.': 'Couldn\'t load Google services. Check the connection.',
  },
};
function t(str, vars) {
  let out = (STRINGS[LANG] && STRINGS[LANG][str]) || str;
  if (vars) out = out.replace(/\{(\w+)\}/g, (m, k) => (vars[k] != null ? vars[k] : m));
  return out;
}
// Textos fijos de la página.
document.documentElement.lang = LANG;
{
  const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
  for (let node = walker.nextNode(); node; node = walker.nextNode()) {
    const key = node.nodeValue.trim();
    if (key && STRINGS[LANG] && STRINGS[LANG][key]) node.nodeValue = node.nodeValue.replace(key, STRINGS[LANG][key]);
  }
}

/**
 * El permiso solo se entrega al panel de Vitri en la red local: http(s) a una IP privada o localhost.
 * Así un enlace malicioso con otro "origin" no puede llevarse el permiso.
 */
function isLocalOrigin(origin) {
  let u;
  try { u = new URL(origin); } catch (e) { return false; }
  if (u.origin !== origin || !/^https?:$/.test(u.protocol)) return false;
  const h = u.hostname;
  if (h === 'localhost' || h === '127.0.0.1') return true;
  const m = h.match(/^(\d+)\.(\d+)\.(\d+)\.(\d+)$/);
  if (!m) return false;
  const [a, b] = [Number(m[1]), Number(m[2])];
  return a === 10 || (a === 192 && b === 168) || (a === 172 && b >= 16 && b <= 31);
}

function fail(text) {
  $('error').textContent = text;
  $('error').hidden = false;
}

function show(step) {
  for (const id of ['start', 'review', 'sent']) $(id).hidden = id !== step;
}

let accessToken = null;
let tokenClient = null;
let pickerReady = false;
const basket = new Map(); // id -> archivo elegido

/** Devuelve el resultado al panel: redirigiendo (móvil) o por postMessage (ventana emergente). */
function deliver(payload) {
  payload = Object.assign({ type: 'vitri-drive', path: targetPath }, payload);
  if (!redirectMode && window.opener && !window.opener.closed) {
    window.opener.postMessage(payload, target);
    window.close();
    // Algunos navegadores no dejan cerrar la ventana: se avisa claramente en vez de dejarla muda.
    setTimeout(() => {
      $('title').textContent = t(payload.cancelled ? 'Cancelado' : 'Enviado a Vitri');
      $('msg').hidden = true;
      $('sentMsg').textContent = payload.cancelled ? t('No se ha importado nada.') :
        t(payload.files.length === 1 ? '✓ {n} archivo enviado' : '✓ {n} archivos enviados', { n: payload.files.length });
      show('sent');
    }, 300);
    return;
  }
  location.replace(target + '/#drive-import=' + encodeURIComponent(JSON.stringify(payload)));
}

function renderBasket() {
  const ul = $('basket');
  ul.replaceChildren();
  for (const f of basket.values()) {
    const li = document.createElement('li');
    const name = document.createElement('span');
    name.className = 'name';
    name.textContent = f.name;
    const kind = document.createElement('span');
    kind.className = 'kind';
    kind.textContent = t(f.mimeType.startsWith('video') ? 'Vídeo' : 'Foto');
    const rm = document.createElement('button');
    rm.className = 'rm';
    rm.textContent = '✕';
    rm.setAttribute('aria-label', t('Quitar {name}', { name: f.name }));
    rm.onclick = () => { basket.delete(f.id); renderBasket(); };
    li.append(name, kind, rm);
    ul.append(li);
  }
  const n = basket.size;
  $('sendBtn').textContent = n ? t(n === 1 ? 'Enviar {n} archivo a Vitri' : 'Enviar {n} archivos a Vitri', { n }) : t('Enviar a Vitri');
  $('sendBtn').disabled = n === 0;
  $('title').textContent = t(n ? 'Listo para enviar' : 'Importar desde Google Drive');
  $('msg').textContent = t(n ? 'Puedes volver a Drive para añadir más antes de enviar.' : 'Elige las fotos y vídeos que quieras llevar a la pantalla.');
  show(n ? 'review' : 'start');
}

function showPicker() {
  const view = new google.picker.DocsView(google.picker.ViewId.DOCS)
    .setMimeTypes(MIME_TYPES).setIncludeFolders(true).setSelectFolderEnabled(false).setMode(google.picker.DocsViewMode.GRID);
  const shared = new google.picker.DocsView(google.picker.ViewId.DOCS)
    .setMimeTypes(MIME_TYPES).setOwnedByMe(false).setMode(google.picker.DocsViewMode.GRID);
  const drives = new google.picker.DocsView(google.picker.ViewId.DOCS)
    .setMimeTypes(MIME_TYPES).setEnableDrives(true).setIncludeFolders(true).setSelectFolderEnabled(false);
  new google.picker.PickerBuilder()
    .setAppId(CONFIG.APP_ID)
    .setDeveloperKey(CONFIG.API_KEY)
    .setOAuthToken(accessToken)
    .setLocale(LANG)
    .setTitle(t('Elige fotos y vídeos para Vitri'))
    .addView(view)
    .addView(shared)
    .addView(drives)
    .enableFeature(google.picker.Feature.MULTISELECT_ENABLED)
    .enableFeature(google.picker.Feature.SUPPORT_DRIVES)
    .setSize(Math.min(1051, window.innerWidth - 20), Math.min(650, window.innerHeight - 20))
    .setCallback(onPicked)
    .build()
    .setVisible(true);
}

function onPicked(data) {
  const action = data[google.picker.Response.ACTION];
  if (action === google.picker.Action.PICKED) {
    for (const d of data[google.picker.Response.DOCUMENTS]) {
      basket.set(d[google.picker.Document.ID], {
        id: d[google.picker.Document.ID],
        name: d[google.picker.Document.NAME],
        mimeType: d[google.picker.Document.MIME_TYPE],
        sizeBytes: d.sizeBytes,
      });
    }
  }
  // Tanto al elegir como al cancelar se vuelve a la cesta (o al inicio si está vacía).
  if (action === google.picker.Action.PICKED || action === google.picker.Action.CANCEL) renderBasket();
}

function openDrive() {
  if (accessToken) { showPicker(); return; }
  tokenClient.requestAccessToken({ prompt: '' });
}

$('pickBtn').addEventListener('click', openDrive);
$('moreBtn').addEventListener('click', openDrive);
$('sendBtn').addEventListener('click', () => deliver({ token: accessToken, files: [...basket.values()] }));
for (const id of ['cancelBtn', 'cancelBtn2']) $(id).addEventListener('click', () => deliver({ cancelled: true }));
$('backBtn').addEventListener('click', () => location.replace(target + '/#content'));

function onGisLoaded() {
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: CONFIG.CLIENT_ID,
    scope: SCOPE,
    callback: resp => {
      if (resp.error) { fail(t('No se ha podido iniciar sesión en Google ({err}).', { err: resp.error })); return; }
      accessToken = resp.access_token;
      showPicker();
    },
    error_callback: err => {
      if (err && err.type === 'popup_closed') return;
      fail(t('No se ha podido abrir el inicio de sesión de Google. Permite las ventanas emergentes para esta página.'));
    },
  });
  $('pickBtn').disabled = !pickerReady;
}

function onGapiLoaded() {
  gapi.load('picker', () => { pickerReady = true; $('pickBtn').disabled = !tokenClient; });
}

if (!isLocalOrigin(target)) {
  $('msg').textContent = t('Abre esta página desde el botón «Drive» del panel de Vitri.');
  $('start').hidden = true;
} else if (!CONFIG.CLIENT_ID || !CONFIG.API_KEY || !CONFIG.APP_ID) {
  fail(t('Falta configurar esta página: crea config.js con CLIENT_ID, API_KEY y APP_ID (ver README.md).'));
} else {
  for (const [src, onload] of [['https://accounts.google.com/gsi/client', onGisLoaded], ['https://apis.google.com/js/api.js', onGapiLoaded]]) {
    const s = document.createElement('script');
    s.src = src;
    s.async = true;
    s.onload = onload;
    s.onerror = () => fail(t('No se han podido cargar los servicios de Google. Comprueba la conexión.'));
    document.head.append(s);
  }
}
</script>
</body>
</html>
